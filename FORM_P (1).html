<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
  <h1>STUDENT FORM</h1>
  
    <form method="get" action="https://ankitsr-1i.github.io/Messi/Messi2.html">
    <table border="1">
    <tr>
      <th>Student Name </th>
      <td>
      <input type="text" id="SNid" name="SNname">  
      </td>
    </tr>
    <tr>
      <th>Father's Name</th>
      <td>
        <input type="text" name="SFname" id="SFname">
      </td>
    </tr>
    <tr>
      <th>DOB</th>
      <td>
        <input type="date" name="Sdob" id="Sdob">
      </td>
    </tr>
    <tr>
      <th> Gender </th>
      <td>
        MALE <input type="radio" name="Sgender" id="Sgender" value="MALE">
        FEMALE <input type="radio" name="Sgender" id="Sgender" value="FEMALE">
        OTHERS <input type="radio" name="Sgender" id="Sgender" value="OTHERS">      
      </td>
    </tr>
    <tr>
      <th>Email</th>
      <td>
        <input type="email" id="Smail" name="Smail">
      </td>
    </tr>
    <tr>
      <th>Mobile No</th>
      <td>
        <input type="tel" name="Snumber" id="Snumber" value="" />
      </td>
    </tr>
    <tr>
      <th>Course</th>
      <td>
       <select name="Scourse" id="Scourse">
        <option selected value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="B.com">B.com</option>
        <option value="BA">BA</option>
       </select>  
      </td>
    </tr>
    <tr>
      <th>Hobbies</th>
     <td>
        coding <input type="checkbox" name="Shobies" id="coding" value="coding">
        playing <input type="checkbox" name="Shobies" id="playing" value="playing">
        music <input type="checkbox" name="Shobies" id="music" value="music">
        reading <input type="checkbox" name="Shobies" id="reading" value="reading">
     </td>
    </tr>
    <tr>
      <th>Address</th>
      <td>
        <textarea name="Sadd" id="Sadd" rows="4" cols="20"></textarea>
      </td>
    </tr>
    <tr>
      <th>Password</th>
      <td>
        <input type="password" name="Spassword" id="Spassword">
      </td>
    </tr>
    <tr>
      <th></th>
      <td>
            <button type="submit">SUBMIT</button>
      
    
             <button type="reset">RESET</button>
      </td>
    </tr>
    
    
  </table>
  </form>
</body>

</html>
